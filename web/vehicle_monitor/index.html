<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Monitor | CeylonTourMate</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1A12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vehicle Monitor">
    <link rel="apple-touch-icon" href="assets/icon-512.png">


    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- TensorFlow.js for Drowsiness Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <!-- MediaPipe Face Mesh for precise landmarks (EAR) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
    <!-- Google Maps API Callback Stub -->
    <script>
        window.initMapModule = function() {
            window.mapsApiLoaded = true;
            if (typeof window.checkAndInitMap === 'function') {
                window.checkAndInitMap();
            }
        };
    </script>
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHfgV77-c-gEIj69enoROYkMLERykgLqs&libraries=geometry,marker&v=weekly&callback=initMapModule&loading=async" async defer></script>


</head>
<body>
    <div id="app">
        <!-- Components will be loaded into this container -->
        <div id="screen-container"></div>
        
        <!-- Loading Overlay -->
        <div id="loader" class="loader-overlay active">
            <div class="spinner"></div>
        </div>

        <!-- Gesture Feedback Indicators -->
        <div id="gesture-left" class="gesture-indicator">
            <span class="material-symbols-rounded">arrow_back_ios_new</span>
        </div>
        <div id="gesture-right" class="gesture-indicator">
            <span class="material-symbols-rounded">arrow_forward_ios</span>
        </div>

        <!-- Modal for Legal Content -->
        <div id="legal-modal" class="modal-overlay">
            <div class="modal-container">
                <div class="modal-header">
                    <h2 id="modal-title">Legal Information</h2>
                    <button id="close-modal" class="close-modal">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>
                <div id="modal-content" class="modal-content">
                    <!-- Content will be injected here -->
                </div>
                <div class="modal-footer">
                    <button id="modal-ok-btn" class="modal-btn">I Understand</button>
                </div>
            </div>
        </div>
        <!-- Notification Container -->
        <div id="notification-container" class="notification-container"></div>
    </div>

    <!-- Entry Point -->
    <script type="module">
        import('./app.js?v=' + Date.now());
    </script>
</body>


</html>
